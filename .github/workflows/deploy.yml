name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: |
          # Create deployment directory
          rm -rf deploy
          mkdir -p deploy
          
          # Copy the integrated game (index.html, game.css)
          cp -r spikes/mathquest-integrated-v1/* deploy/
          
          # Copy all mathquest-art-kit-v1 files (scene.js and its dependencies)
          mkdir -p deploy/mathquest-art-kit-v1
          cp -r spikes/mathquest-art-kit-v1/* deploy/mathquest-art-kit-v1/
          
          # Debug: check if assets folder exists in source
          ls -la spikes/mathquest-art-kit-v1/
          ls -la spikes/mathquest-art-kit-v1/assets/ || echo "assets folder not found in source"
          
          # Debug: check if assets folder was copied
          ls -la deploy/mathquest-art-kit-v1/
          
          # Copy thirdperson-camera vendor files (Three.js)
          mkdir -p deploy/vendor
          cp spikes/thirdperson-camera/vendor/three.module.min.js deploy/vendor/
          cp spikes/thirdperson-camera/vendor/three.core.min.js deploy/vendor/
          
          # Copy production-art vendor files
          cp spikes/production-art/vendor/GLTFLoader.js deploy/vendor/
          cp spikes/production-art/vendor/BufferGeometryUtils.js deploy/vendor/

          # Preserve the procedural fallback texture used while the rig loads.
          mkdir -p deploy/assets/fair/player
          cp assets/fair/player/run-up.png deploy/assets/fair/player/
          
          # Copy ALL assets including GLB models and textures for production
          mkdir -p deploy/assets
          cp -r assets/* deploy/assets/
          
          # Copy mathquest-art-kit-v1 assets (GLB models, textures)
          mkdir -p deploy/mathquest-art-kit-v1/assets
          cp -r spikes/mathquest-art-kit-v1/assets/* deploy/mathquest-art-kit-v1/assets/
          
          # Fix importmap in index.html for GitHub Pages base path
          # The scene.js is now at ./mathquest-art-kit-v1/scene.js
          sed -i 's|"three": "\.\./thirdperson-camera/vendor/three.module.min.js"|"three": "./vendor/three.module.min.js"|g' deploy/index.html
          sed -i 's|"mergeGeometries": "\.\./production-art/vendor/BufferGeometryUtils.js"|"mergeGeometries": "./vendor/BufferGeometryUtils.js"|g' deploy/index.html
          sed -i 's|"GLTFLoader": "\.\./production-art/vendor/GLTFLoader.js"|"GLTFLoader": "./vendor/GLTFLoader.js"|g' deploy/index.html
          
          # Fix script src in index.html to point to the new location
          sed -i 's|src="\.\./mathquest-art-kit-v1/scene.js"|src="./mathquest-art-kit-v1/scene.js"|g' deploy/index.html
          
          # Verify key files exist
          ls -la deploy/
          ls -la deploy/mathquest-art-kit-v1/
          ls -la deploy/vendor/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
